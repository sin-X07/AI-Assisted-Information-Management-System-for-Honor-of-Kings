<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王者荣耀 · 数据可视化仪表盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", -apple-system, sans-serif; background: #0f1923; color: #e0e6ed; }
  .header { background: linear-gradient(135deg, #1a2a3a, #0d1b2a); padding: 20px 32px; border-bottom: 2px solid #c8a84e; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; flex-direction: column; }
  .header h1 { font-size: 24px; color: #c8a84e; letter-spacing: 2px; }
  .header p { font-size: 13px; color: #8899aa; margin-top: 4px; }
  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search-wrapper { position: relative; display: flex; align-items: center; }
  .search-box { display: flex; align-items: center; background: #0f1923; border: 1px solid #2a3a4a; border-radius: 6px; padding: 4px 12px; min-width: 240px; }
  .search-box:focus-within { border-color: #c8a84e; }
  .search-box input { background: none; border: none; color: #e0e6ed; font-size: 14px; padding: 8px 4px; outline: none; width: 100%; }
  .search-box input::placeholder { color: #556677; }
  .refresh-btn { background: #c8a84e; border: none; color: #0f1923; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .refresh-btn:hover { background: #d4b85e; }
  .search-results { position: absolute; top: 100%; right: 0; margin-top: 4px; background: #1a2a3a; border: 1px solid #2a3a4a; border-radius: 8px; width: 380px; max-height: 420px; overflow-y: auto; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.5); z-index: 100; }
  .search-results.open { display: block; }
  .search-result-item { padding: 10px 14px; border-bottom: 1px solid #2a3a4a; cursor: pointer; transition: background 0.15s; }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: #2a3a4a; }
  .search-result-item .hero-name { color: #c8a84e; font-weight: 600; font-size: 14px; }
  .search-result-item .hero-title { color: #8899aa; font-size: 12px; margin-left: 6px; }
  .search-result-item .hero-meta { color: #6b7c8d; font-size: 12px; margin-top: 2px; }
  .search-result-item .hero-abilities { display: flex; gap: 10px; margin-top: 4px; font-size: 11px; }
  .search-result-item .hero-abilities span { background: #2a3a4a; padding: 1px 8px; border-radius: 4px; color: #8899aa; }
  .dashboard { max-width: 1440px; margin: 0 auto; padding: 20px; }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: linear-gradient(135deg, #1a2a3a, #0d1b2a); border: 1px solid #2a3a4a; border-radius: 10px; padding: 18px 20px; text-align: center; transition: transform 0.15s; }
  .stat-card:hover { transform: translateY(-2px); border-color: #c8a84e; }
  .stat-card .stat-value { font-size: 32px; font-weight: 700; color: #c8a84e; }
  .stat-card .stat-label { font-size: 13px; color: #8899aa; margin-top: 4px; }
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .card { background: #1a2a3a; border: 1px solid #2a3a4a; border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 15px; color: #c8a84e; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .card h2 .status-badge { font-size: 11px; font-weight: 400; color: #5abf5a; background: rgba(90,191,90,0.15); padding: 2px 8px; border-radius: 10px; }
  .card-full { grid-column: 1 / -1; }
  .chart { width: 100%; height: 340px; position: relative; }
  .chart canvas.chart-canvas { width: 100%; height: 100%; }
  .chart-loading { display: flex; align-items: center; justify-content: center; height: 340px; color: #556677; font-size: 14px; }
  .chart-error { display: flex; align-items: center; justify-content: center; height: 340px; color: #556677; font-size: 14px; padding: 20px; text-align: center; }
  .timeout-notice { display: none; text-align: center; padding: 40px 20px; }
  .timeout-notice h2 { color: #c8a84e; margin-bottom: 8px; font-size: 18px; }
  .timeout-notice p { color: #8899aa; font-size: 14px; line-height: 1.6; }
  .timeout-notice .retry-btn { background: #c8a84e; border: none; color: #0f1923; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; margin-top: 16px; }
  .timeout-notice .retry-btn:hover { background: #d4b85e; }
  .echarts-load-error { display: none; text-align: center; padding: 40px 20px; }
  .echarts-load-error h2 { color: #556677; margin-bottom: 8px; font-size: 18px; }
  .echarts-load-error p { color: #8899aa; font-size: 14px; line-height: 1.6; }
  #version-info { font-size: 11px; color: #556677; }
  .footer-badge { text-align: center; padding: 12px 20px 24px; color: #556677; font-size: 12px; }
  .footer-badge span { color: #c8a84e; }
  @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: stretch; } .header-actions { flex-wrap: wrap; } .search-box { min-width: 100%; } .search-results { width: 100%; } }
</style>

<!-- ======== CHART RENDERING ======== -->
<script>
var usingCanvasFallback = false;
var COLORS = ["#c8a84e","#e8594e","#5abf5a","#4ea8e8","#b48ad8","#f0a030","#e86a8a","#5abfbf","#d4b85e","#6b7c8d","#ff7f50","#98d8c8"];
var radarColors = ["#c8a84e","#e8594e","#5abf5a","#4ea8e8","#b48ad8","#f0a030","#e86a8a","#5abfbf","#d4b85e","#ff7f50"];

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function levenshtein(a, b) {
  var al = a.length, bl = b.length;
  var dp = [];
  for (var i = 0; i <= al; i++) { dp[i] = []; dp[i][0] = i; }
  for (var j = 0; j <= bl; j++) { dp[0][j] = j; }
  for (var i = 1; i <= al; i++) {
    for (var j = 1; j <= bl; j++) {
      var cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[al][bl];
}
function initChart(id) {
  if (usingCanvasFallback) return null;
  var el = document.getElementById(id);
  if (!el || typeof echarts === 'undefined') return null;
  el.innerHTML = '';
  try { return echarts.init(el, 'dark'); } catch(e) { return null; }
}
function clearLoading(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var ld = el.querySelector('.chart-loading');
  if (ld) ld.style.display = 'none';
}

function drawCanvasPie(cid, labels, values) {
  var el = document.getElementById(cid); if (!el) return; clearLoading(cid);
  var cv = document.createElement('canvas'); cv.className = 'chart-canvas'; el.appendChild(cv);
  var r = el.getBoundingClientRect(); var w = r.width||400, h = r.height||300;
  var dpr = window.devicePixelRatio||1; cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+'px'; cv.style.height = h+'px';
  var ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  var cx = w*0.4, cy = h*0.48, rad = Math.min(w,h)*0.3;
  var total = values.reduce(function(a,b){return a+b},0) || 1;
  var start = -Math.PI/2;
  for (var i = 0; i < Math.min(labels.length, 40); i++) {
    var angle = (values[i]/total)*2*Math.PI;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,rad,start,start+angle);
    ctx.closePath(); ctx.fillStyle = COLORS[i%COLORS.length]; ctx.fill();
    ctx.strokeStyle = '#1a2a3a'; ctx.lineWidth = 2; ctx.stroke();
    start += angle;
  }
  var ly = 20;
  for (var i = 0; i < Math.min(labels.length, 12); i++) {
    ctx.fillStyle = COLORS[i%COLORS.length]; ctx.fillRect(w*0.72, ly, 10, 10);
    ctx.fillStyle = '#e0e6ed'; ctx.font = '10px Microsoft YaHei'; ctx.textAlign = 'left';
    var pct = ((values[i]/total)*100).toFixed(1);
    ctx.fillText(labels[i].length>6?labels[i].slice(0,6)+'..':labels[i]+' '+pct+'%', w*0.72+14, ly+9);
    ly += 20;
  }
}
function drawCanvasBar(cid, labels, values) {
  var el = document.getElementById(cid); if (!el) return; clearLoading(cid);
  var cv = document.createElement('canvas'); cv.className = 'chart-canvas'; el.appendChild(cv);
  var r = el.getBoundingClientRect(); var w = r.width||400, h = r.height||300;
  var dpr = window.devicePixelRatio||1; cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+'px'; cv.style.height = h+'px';
  var ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  var pt=20, pr=20, pb=80, pl=50, cw=w-pl-pr, ch=h-pt-pb;
  if (cw <= 0 || ch <= 0) return;
  var maxV = Math.max.apply(null, values) || 1;
  var bw = Math.min(30, cw/values.length*0.5), gap = cw/values.length;
  ctx.strokeStyle = '#2a3a4a'; ctx.lineWidth = 0.5; ctx.setLineDash([4,4]);
  for (var g = 0; g <= 4; g++) { var gy = pt+ch*(1-g/4); ctx.beginPath(); ctx.moveTo(pl,gy); ctx.lineTo(w-pr,gy); ctx.stroke(); ctx.fillStyle='#8899aa'; ctx.font='10px Microsoft YaHei'; ctx.textAlign='right'; ctx.fillText(Math.round(maxV*g/4), pl-6, gy+4); }
  ctx.setLineDash([]);
  var len = Math.min(values.length, 40);
  for (var i = 0; i < len; i++) {
    var bx = pl + i*gap + (gap-bw)/2;
    var bh = (values[i]/maxV)*ch; var by = pt+ch-bh;
    ctx.fillStyle = COLORS[i%COLORS.length]; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle = '#e0e6ed'; ctx.font = '9px Microsoft YaHei'; ctx.textAlign = 'center';
    ctx.fillText(Math.round(values[i]), bx+bw/2, by-3);
    ctx.save(); ctx.translate(bx+bw/2, pt+ch+8); ctx.rotate(Math.PI/6); ctx.fillStyle='#8899aa'; ctx.font='9px Microsoft YaHei'; ctx.textAlign='right'; ctx.fillText(labels[i].length>6?labels[i].slice(0,6)+'..':labels[i],0,0); ctx.restore();
  }
}
function drawCanvasRadar(cid, indicators, seriesData) {
  var el = document.getElementById(cid); if (!el) return; clearLoading(cid);
  var cv = document.createElement('canvas'); cv.className = 'chart-canvas'; el.appendChild(cv);
  var r = el.getBoundingClientRect(); var w = r.width||500, h = r.height||380;
  var dpr = window.devicePixelRatio||1; cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+'px'; cv.style.height = h+'px';
  var ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  var cx = w*0.38, cy = h*0.46, rad = Math.min(w,h)*0.28;
  var astep = 2*Math.PI/indicators.length;
  for (var lev = 1; lev <= 5; lev++) {
    var r2 = rad*(lev/5); ctx.beginPath();
    for (var i = 0; i <= indicators.length; i++) { var a = -Math.PI/2+i*astep; var x = cx+r2*Math.cos(a); var y = cy+r2*Math.sin(a); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.strokeStyle = lev===5 ? '#3a4a5a' : '#2a3a4a'; ctx.lineWidth = lev===5 ? 1 : 0.5; ctx.stroke();
  }
  for (var i = 0; i < indicators.length; i++) {
    var a = -Math.PI/2+i*astep;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+rad*Math.cos(a),cy+rad*Math.sin(a)); ctx.strokeStyle='#2a3a4a'; ctx.lineWidth=0.5; ctx.stroke();
    ctx.fillStyle='#e0e6ed'; ctx.font='12px Microsoft YaHei'; ctx.textAlign='center'; ctx.fillText(indicators[i].name, cx+(rad+16)*Math.cos(a), cy+(rad+16)*Math.sin(a)+4);
  }
  for (var s = 0; s < seriesData.length; s++) {
    var d = seriesData[s]; ctx.beginPath();
    for (var i = 0; i < d.value.length; i++) {
      var val = Math.min(d.value[i],10)/10; var a = -Math.PI/2+i*astep; var x = cx+rad*val*Math.cos(a); var y = cy+rad*val*Math.sin(a);
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fillStyle=radarColors[s%radarColors.length]; ctx.globalAlpha=0.12; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle=radarColors[s%radarColors.length]; ctx.lineWidth=2; ctx.stroke();
    for (var i = 0; i < d.value.length; i++) {
      var val = Math.min(d.value[i],10)/10; var a = -Math.PI/2+i*astep; var x=cx+rad*val*Math.cos(a); var y=cy+rad*val*Math.sin(a);
      ctx.beginPath(); ctx.arc(x,y,3,0,2*Math.PI); ctx.fillStyle=radarColors[s%radarColors.length]; ctx.fill();
    }
  }
  for (var s = 0; s < seriesData.length && s < 15; s++) {
    var iy = 20+s*20;
    ctx.fillStyle = radarColors[s%radarColors.length]; ctx.fillRect(w*0.72, iy, 12, 12);
    ctx.fillStyle = '#e0e6ed'; ctx.font = '11px Microsoft YaHei'; ctx.textAlign = 'left';
    ctx.fillText(seriesData[s].name, w*0.72+18, iy+10);
  }
}

// ── Local Search (no API needed) ──
function doSearch(query) {
  var resultsEl = document.getElementById('searchResults');
  if (!query || query.length < 1) { resultsEl.classList.remove('open'); resultsEl.innerHTML = ''; return; }
  var q = query.toLowerCase().trim();
  var scored = [];
  for (var i = 0; i < ALL_HEROES.length; i++) {
    var h = ALL_HEROES[i];
    var s1 = 0, s2 = 0;
    if (h.heroName.toLowerCase().indexOf(q) !== -1) s1 = 1;
    if (h.position.toLowerCase().indexOf(q) !== -1) s2 = 0.6;
    if (h.title.toLowerCase().indexOf(q) !== -1) s2 = Math.max(s2, 0.5);
    if (h.heroType.toLowerCase().indexOf(q) !== -1) s2 = Math.max(s2, 0.5);
    if (h.difficulty.toLowerCase().indexOf(q) !== -1) s2 = Math.max(s2, 0.3);
    var dist = levenshtein(q, h.heroName.toLowerCase().substring(0, Math.min(q.length+2, 20)));
    var fuzzy = 1 - dist / Math.max(q.length, Math.min(h.heroName.length, 20));
    var score = Math.max(s1 + s2, fuzzy * 0.8);
    if (score > 0.1) { scored.push({h: h, s: score}); }
  }
  scored.sort(function(a,b){ return b.s - a.s; });
  var top = scored.slice(0, 8);
  if (top.length === 0) { resultsEl.classList.remove('open'); resultsEl.innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < top.length; i++) {
    var h = top[i].h;
    html += '<div class="search-result-item" onclick="showHeroAlert(\'' + escapeHtml(h.heroId) + '\')">';
    html += '<span class="hero-name">' + escapeHtml(h.heroName) + '</span>';
    html += '<span class="hero-title">' + escapeHtml(h.title) + '</span>';
    html += '<div class="hero-meta">' + escapeHtml(h.position) + ' | ' + escapeHtml(h.heroType) + ' | ' + escapeHtml(h.difficulty) + '</div>';
    html += '<div class="hero-abilities"><span>生存' + h.survivalAbility + '</span><span>攻击' + h.attackAbility + '</span><span>技能' + h.skillAbility + '</span><span>辅助' + h.supportAbility + '</span></div>';
    html += '</div>';
  }
  resultsEl.innerHTML = html;
  resultsEl.classList.add('open');
}
function showHeroAlert(heroId) {
  for (var i = 0; i < ALL_HEROES.length; i++) {
    if (ALL_HEROES[i].heroId === heroId) {
      var h = ALL_HEROES[i];
      alert('英雄: ' + h.heroName + '\n称号: ' + h.title + '\n定位: ' + h.position + '\n类型: ' + h.heroType + '\n难度: ' + h.difficulty + '\n生存: ' + h.survivalAbility + ' 攻击: ' + h.attackAbility + ' 技能' + h.skillAbility + ' 辅助: ' + h.supportAbility);
      return;
    }
  }
}

  var chartIds = ['chart-position','chart-type','chart-ability','chart-equip-price','chart-difficulty','chart-team-winrate'];
  chartIds.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) { el.innerHTML = '<div class="chart-loading">加载中..</div>'; }
  });
  document.getElementById('statHeroes').textContent = '--';
  document.getElementById('statPositions').textContent = '--';
  document.getElementById('statEquipments').textContent = '--';
  document.getElementById('statTeams').textContent = '--';
  initDashboard();
}

<!-- ======== ECHARTS CDN LOADING ======== -->
<script>
(function() {
  var urls = [
    "https://unpkg.com/echarts@5.6.0/dist/echarts.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js",
    "https://cdn.bootcdn.net/ajax/libs/echarts/5.6.0/echarts.min.js",
    "https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js",
    "https://registry.npmmirror.com/echarts/5.6.0/files/dist/echarts.min.js"
  ];
  var idx = 0;
  var resolved = false;

  function onReady() {
    if (resolved) return;
    resolved = true;
    if (typeof initDashboard === "function") {
      initDashboard();
    }
  }

  function tryLoad() {
    if (idx >= urls.length) {
      usingCanvasFallback = true;
      var errDiv = document.getElementById("echartsLoadError");
      if (errDiv) errDiv.style.display = "block";
      var ver = document.getElementById("version-info");
      if (ver) ver.textContent = "所有CDN源均失败，使用Canvas后备渲染";
      onReady();
      return;
    }
    var s = document.createElement("script");
    s.src = urls[idx];
    s.onload = function() {
      var errDiv = document.getElementById("echartsLoadError");
      if (errDiv) errDiv.style.display = "none";
      onReady();
    };
    s.onerror = function() {
      if (s.parentNode) s.parentNode.removeChild(s);
      idx++;
      tryLoad();
    };
    document.head.appendChild(s);
  }

  tryLoad();

  setTimeout(function() {
    if (!resolved && typeof echarts === "undefined") {
      usingCanvasFallback = true;
      var errDiv = document.getElementById("echartsLoadError");
      if (errDiv) errDiv.style.display = "block";
      var ver = document.getElementById("version-info");
      if (ver) ver.textContent = "CDN 加载超时，使用 Canvas 后备渲染";
      onReady();
    }
  }, 10000);
})();
</script>
